name: Bug Report
description: Something in Code Comply is broken or behaves incorrectly
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for **defects** (crashes, incorrect data, UI that does not match expected behavior).

        Do **not** include passwords, tokens, personal client data, or exploit details. For security issues, use the private Security advisory link in the issue chooser.
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Inspector PWA / field app
        - Admin portal
        - API / sync
        - Auth / login
        - Checklists / code library UI
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences summarizing the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or status codes if visible (redact secrets).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps someone else can follow.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Always
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Device/OS, browser or app build, network (online/offline) if relevant"
      placeholder: Android 14 · Chrome · PWA · offline then sync
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings (optional)
      description: Paste images or links. Redact names, addresses, and permit identifiers that are not needed to reproduce.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report does not include credentials, private keys, or unnecessary personal/client data.
          required: true
